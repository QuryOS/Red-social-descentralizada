<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Codex</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- BARRA SUPERIOR -->
  <header class="barra-superior">
    <div class="logo-codex">Codex</div>
    <button class="icono-btn" id="btnBuscar">
      <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
    </button>
  </header>

  <!-- BARRA FLOTANTE DE LLAMADA EN CURSO -->
  <div id="barraLlamadaActiva" class="barra-llamada-activa oculto">
    <div class="info-llamada-barra">
      <span class="numero-llamada-barra" id="numeroLlamadaBarra">Desconocido</span>
      <span class="tiempo-llamada" id="tiempoLlamadaBarra">00:00</span>
    </div>
    <div class="acciones-barra">
      <button class="icono-btn pequeño" id="btnMinimizarLlamada" title="Minimizar">
        <svg viewBox="0 0 24 24"><path d="M19 13H5v-2h14v2z"/></svg>
      </button>
      <button class="icono-btn pequeño" id="btnSilenciarBarra" title="Silenciar micrófono">
        <svg id="icono-mudo-barra" viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1 1.93c-3.94-.49-7-3.85-7-7.93h2c0 2.76 2.24 5 5 5s5-2.24 5-5h2c0 4.08-3.06 7.44-7 7.93V19h4v2h-4v3h2v-3c4.28-.26 7.5-3.89 7.5-8.33h-2c0 3.41-2.58 6.26-6 6.6V15.93z"/></svg>
      </button>
      <button class="icono-btn pequeño" id="btnAltavozBarra" title="Altavoz">
        <svg id="icono-altavoz-barra" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
      </button>
      <button class="icono-btn pequeño" id="btnCamaraBarra" title="Cámara">
        <svg id="icono-camara-barra" viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
      </button>
      <button class="icono-btn pequeño" id="btnChatDesdeLlamada" title="Ir al chat">
        <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
      </button>
      <button class="icono-btn pequeño btn-colgar-barra" id="btnColgarBarra" title="Colgar llamada">
        <svg viewBox="0 0 24 24"><path d="M12 9a3 3 0 0 0-3 3v1a3 3 0 0 0 3 3 3 3 0 0 0 3-3v-1a3 3 0 0 0-3-3zm6 6c0 1.1-.9 2-2 2H8c-1.1 0-2-.9-2-2V9c0-1.1.9-2 2-2h8c1.1 0 2 .9 2 2v6z"/></svg>
      </button>
    </div>
  </div>

  <!-- PANTALLA PRINCIPAL -->
  <main id="pantallaPrincipal" class="pantalla activa">
    <!-- ESTADO CONEXIÓN -->
    <div class="seccion-estado">
      <p class="etiqueta">Tu número:</p>
      <div class="fila-numero">
        <input type="text" id="miNumero" placeholder="Escribe tu número">
        <button id="btnConectar" class="btn-primario">Conectar</button>
      </div>
      <p id="estadoConexion" class="estado-texto">Desconectado</p>
    </div>

    <!-- CONTENEDOR DE VISTAS -->
    <div class="contenedor-vistas">
      <!-- VISTA MENSAJES -->
      <div class="vista-pestana activa" id="vista-chats">
        <div id="listaChats"></div>
        <p id="sinChats" class="texto-vacio">No tienes conversaciones.<br>Ve a "Usuarios" para empezar.</p>
      </div>

      <!-- VISTA USUARIOS -->
      <div class="vista-pestana" id="vista-usuarios">
        <div class="seccion-agregar">
          <label>Agregar por número:</label>
          <div class="fila-input">
            <input type="text" id="numeroDestino" placeholder="Escribe el número">
            <button id="btnAgregarUsuario" class="btn-primario">
              <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
            </button>
          </div>
        </div>
        <h4>Contactos:</h4>
        <div id="listaContactos"></div>
      </div>

      <!-- VISTA LLAMADAS -->
      <div class="vista-pestana" id="vista-llamadas">
        <div id="listaLlamadas"></div>
        <p id="sinLlamadas" class="texto-vacio">Sin llamadas recientes.</p>
      </div>
    </div>

    <!-- MENÚ INFERIOR FLOTANTE -->
    <nav class="menu-inferior">
      <button class="item-menu activa" data-pestana="chats">
        <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/></svg>
        <span>Mensajes</span>
        <span class="contador-sin-leer" id="contadorGlobalSinLeer">0</span>
      </button>
      <button class="item-menu" data-pestana="usuarios">
        <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        <span>Usuarios</span>
      </button>
      <button class="item-menu" data-pestana="llamadas">
        <svg viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
        <span>Llamadas</span>
      </button>
    </nav>
  </main>

  <!-- VENTANA EMERGENTE PERFIL DE USUARIO -->
  <div id="perfilUsuarioModal" class="modal-perfil oculto">
    <div class="contenido-modal-perfil">
      <button class="cerrar-modal-perfil" id="btnCerrarPerfil">
        <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
      </button>
      
      <div class="foto-perfil-grande" id="fotoPerfilGrande">
        <span id="inicialPerfil">?</span>
      </div>
      
      <div class="estado-en-linea" id="estadoEnLinea">
        <span class="punto-estado"></span>
        <span id="textoEstado">Desconocido</span>
      </div>
      
      <div class="campo-perfil">
        <label>Nombre:</label>
        <input type="text" id="nombrePerfil" placeholder="Sin nombre">
        <button class="icono-btn pequeño" id="btnEditarNombre" title="Editar nombre">
          <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
        </button>
      </div>
      
      <div class="campo-perfil">
        <label>Número:</label>
        <div class="texto-perfil" id="numeroPerfil">+00 000 000 000</div>
      </div>
      
      <button class="btn-primario" id="btnGuardarPerfil">Guardar cambios</button>
    </div>
  </div>

  <!-- MENÚ ELIMINAR CHAT -->
  <div id="menuEliminarChat" class="menu-eliminar oculto">
    <div class="opcion-eliminar" id="opcionEliminarChat">
      <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
      <span>Eliminar conversación</span>
    </div>
  </div>

  <!-- VISTA DE CHAT INDIVIDUAL -->
  <aside id="pantallaChat" class="pantalla">
    <header class="cabecera-chat">
      <button class="icono-btn" id="btnVolver">
        <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      </button>
      <div class="nombre-contacto" id="nombreChat">
        <span id="textoNombreChat"></span>
        <span class="subtitulo-chat" id="subtituloChat"></span>
      </div>
      <button class="icono-btn" id="btnVerPerfil">
        <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      </button>
      <button class="icono-btn" id="btnLlamar">
        <svg viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
      </button>
    </header>

    <div class="caja-mensajes" id="cajaMensajes"></div>

    <!-- OPCIONES DESPLEGABLES -->
    <div class="opciones-envio" id="menuOpciones">
      <button class="opcion-envio" data-tipo="imagen">
        <svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
        <span>Imagen</span>
      </button>
      <button class="opcion-envio" data-tipo="video">
        <svg viewBox="0 0 24 24"><path d="M18 4l2 4h-3l-2-4h-2l2 4h-3l-2-4H8l2 4H7L5 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4h-4zM9 13l3-4 3 4H9zm5-1l-1.5-2L14 9l1.5 2H14z"/></svg>
        <span>Video</span>
      </button>
      <button class="opcion-envio" data-tipo="audio">
        <svg viewBox="0 0 24 24"><path d="M12 3v9.28c-.47-.17-.97-.28-1.5-.28C8.01 12 6 14.01 6 16.5S8.01 21 10.5 21c2.31 0 4.2-1.75 4.45-4H15V6h4V3h-7z"/></svg>
        <span>Audio</span>
      </button>
    </div>

    <!-- BARRA DE ENVÍO -->
    <div class="barra-envio">
      <button class="icono-btn" id="btnOpciones">
        <svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
      </button>
      <input type="text" id="inputMensaje" placeholder="Escribe un mensaje...">
      <button class="icono-btn enviar" id="btnEnviar">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </aside>

  <!-- PANTALLA DE LLAMADA EN CURSO -->
  <div id="pantallaLlamada" class="pantalla oculto">
    <div class="contenedor-llamada-pantalla">
      <p class="etiqueta-estado-llamada" id="estadoLlamada">Conectando...</p>
      <div class="info-llamada-central">
        <div class="avatar-llamada" id="avatarLlamada">?</div>
        <p class="numero-llamada-grande" id="numeroLlamadaGrande">Desconocido</p>
        <p class="tiempo-llamada-grande" id="tiempoLlamadaGrande">00:00</p>
      </div>
      
      <div class="controles-llamada">
        <button class="btn-control-llamada" id="btnSilenciarLlamada" title="Silenciar micrófono">
          <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1 1.93c-3.94-.49-7-3.85-7-7.93h2c0 2.76 2.24 5 5 5s5-2.24 5-5h2c0 4.08-3.06 7.44-7 7.93V19h4v2h-4v3h2v-3c4.28-.26 7.5-3.89 7.5-8.33h-2c0 3.41-2.58 6.26-6 6.6V15.93z"/></svg>
        </button>
        <button class="btn-control-llamada" id="btnAltavozLlamada" title="Activar altavoz">
          <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
        </button>
        <button class="btn-control-llamada" id="btnCamaraLlamada" title="Activar cámara">
          <svg viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
        </button>
        <button class="btn-control-llamada" id="btnMinimizarPantallaLlamada" title="Minimizar">
          <svg viewBox="0 0 24 24"><path d="M19 13H5v-2h14v2z"/></svg>
        </button>
      </div>
      
      <button id="btnColgarPantalla" class="btn-colgar-grande" title="Finalizar llamada">
        <svg viewBox="0 0 24 24"><path d="M12 9a3 3 0 0 0-3 3v1a3 3 0 0 0 3 3 3 3 0 0 0 3-3v-1a3 3 0 0 0-3-3zm6 6c0 1.1-.9 2-2 2H8c-1.1 0-2-.9-2-2V9c0-1.1.9-2 2-2h8c1.1 0 2 .9 2 2v6z"/></svg>
      </button>
    </div>
  </div>

  <!-- LLAMADA ENTRANTE -->
  <div id="pantallaLlamadaEntrante" class="pantalla oculto">
    <div class="contenedor-llamada-pantalla">
      <p class="etiqueta-estado-llamada">Llamada entrante</p>
      <div class="info-llamada-central">
        <div class="avatar-llamada" id="avatarLlamadaEntrante">?</div>
        <p class="numero-llamada-grande" id="quienLlama">Desconocido</p>
      </div>
      <div class="botones-llamada">
        <button id="btnRechazar" class="btn-colgar" title="Rechazar llamada">
          <svg viewBox="0 0 24 24"><path d="M12 9a3 3 0 0 0-3 3v1a3 3 0 0 0 3 3 3 3 0 0 0 3-3v-1a3 3 0 0 0-3-3zm6 6c0 1.1-.9 2-2 2H8c-1.1 0-2-.9-2-2V9c0-1.1.9-2 2-2h8c1.1 0 2 .9 2 2v6z"/></svg>
        </button>
        <button id="btnResponder" class="btn-responder" title="Responder llamada">
          <svg viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- VISOR IMAGEN/VIDEO EN PANTALLA COMPLETA -->
  <div id="visorCompleto" class="visor-completo oculto">
    <button class="cerrar-visor" id="btnCerrarVisor">
      <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
    </button>
    <div id="contenidoVisor"></div>
  </div>

  <!-- INPUTS OCULTOS -->
  <input type="file" id="inputImagen" accept="image/*" class="oculto">
  <input type="file" id="inputVideo" accept="video/*" class="oculto">

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
